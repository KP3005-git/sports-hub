  if(!$('#gdmodal')) document.body.classList.remove('modal-on');
}
async function openRoster(lg, id){
  if(!LG[lg]||!id) return;

  if(!$('#rostermodal')){
    document.body.insertAdjacentHTML('beforeend', `<div id="rostermodal" class="modal"><div class="mbox" role="dialog" aria-modal="true" aria-label="Team roster"><div class="mtop"><button class="btn sm mclose" data-rosterclose="1" aria-label="Close">✕<span class="mcl"> Close</span></button></div><div id="rosterbody"><div class="note">Loading roster…</div></div></div></div>`);
    document.body.classList.add('modal-on');
  } else $('#rosterbody').innerHTML='<div class="note">Loading roster…</div>';
  RST={lg, id, token, data:null};

    const [data]=await Promise.all([rosterLoad(lg, id), injEnsure([lg])]);

  }catch(e){ if(token===RSTN) $('#rosterbody').innerHTML=`<div class="empty">Could not load this roster from ESPN (${esc(e.message)}).</div>`; }
}

async function monWakeSync(){
  const noteEl=document.querySelector('#monwake span');
  const wrap=$('#monwake');
  const setup=$('#monwakenote');
  const supported = typeof navigator!=='undefined' && navigator.wakeLock && window.isSecureContext;
  const want = MON.on && monIsLandscape() && !document.hidden && TAB==='monitor';
  const paint=(cls, txt)=>{ if(wrap){ wrap.className='monwake'+(cls?' '+cls:''); } if(noteEl) noteEl.textContent=txt; MON.wakeNote=txt; if(setup) setup.textContent=txt; };
  if(!navigator.wakeLock){ await monReleaseWake(); paint('off', 'This browser has no Screen Wake Lock — the phone may dim.'); return; }
  if(!window.isSecureContext){ await monReleaseWake(); paint('off', 'Wake lock needs HTTPS. The board still works; the screen may dim.'); return; }
  if(!want){
    const msg = document.hidden && MON.on ? 'Paused — page is hidden' : (MON.on && !monIsLandscape() ? 'Portrait — wake lock stays off until landscape.' : 'Screen can sleep');
    paint('', msg);
    await monReleaseWake();
    return;
  }
  if(MON.wake){ paint('on', 'Keeping screen awake'); return; }
  try{
    const sentinel = await navigator.wakeLock.request('screen');
    MON.wake=sentinel;
    sentinel.addEventListener('release', ()=>{ if(MON.wake===sentinel){ MON.wake=null; if(TAB==='monitor' && !document.hidden) monWakeSync(); } });
    paint('on', 'Keeping screen awake');
  }catch(e){
    MON.wake=null;
    paint('off', 'Couldn’t keep the screen awake'+(e&&e.name?' ('+e.name+')':'')+'. The board still works.');
  }
  void supported;
}
async function monReleaseWake(){
  const w=MON.wake; MON.wake=null;

}
function monArmRotation(){

    MON.prev.set(g.id, snap);
    if(!prev || g.state!=='in' || snap.away==null) continue;
    const scored = prev.away!==snap.away || prev.home!==snap.home;
    const lead = prev.lead && snap.lead && prev.lead!=='tie' && snap.lead!=='tie' && prev.lead!==snap.lead;
    const to = !scored && snap.last && snap.last!==prev.last && /interception|intercepted|fumble|turnover|picks off/i.test(snap.last);
    if(!(scored||lead||to)) continue;
    const scoredText = (scored||lead) ? monScoreBlurb(g) : '';
    monShowFlash({ kicker: lead?'LEAD CHANGE':scored?'SCORE':'TURNOVER', big:`${g.away.abbr} ${snap.away}  –  ${snap.home} ${g.home.abbr}`, sub:scoredText||snap.last||statusTxt(g), who:`${g.away.abbr} at ${g.home.abbr}`, sim:false });

async function monLoad(tok){
  MON.ctx = MON.ctx || await monContext();
  if(tok!==TOKEN) return;
  const lists=await Promise.all(LGS.map(async lg=>{
    try{ const d=await getJSON(monBoardURL(lg), 15000); return remember((d.events||[]).map(e=>normEvent(e, lg))); }
    catch(e){ MON.err=e.message; return []; }
  }));
  if(tok!==TOKEN) return;
  MON.pool=lists.flat();
  const ranked=MON.pool.map(g=>({g, p:monPriority(g, MON.ctx)}));
  const live=ranked.filter(x=>isLive(x.g)).sort((a,b)=>b.p-a.p || a.g.date-b.g.date);
  const rest=ranked.filter(x=>!isLive(x.g) && x.g.state!=='pre').sort((a,b)=>b.g.date-a.g.date);
  const soon=ranked.filter(x=>x.g.state==='pre').sort((a,b)=>a.g.date-b.g.date).slice(0,6);
  const recent=rest.filter(x=>Date.now()-x.g.date<48*3600e3);
  MON.choices=(live.length?live:recent.length?recent:rest.slice(0,8).concat(soon)).map(x=>x.g);
  if(!live.length && !MON.choices.length) MON.choices=soon.map(x=>x.g);
  const follow=pref.get('monitor.follow','rotate');
  const pins=monPins();
  let games;
  if(follow==='pin'){
    const resolved=[];
    for(const key of pins){
      const g=await monResolvePin(key);
      if(tok!==TOKEN) return;
      if(g && !resolved.some(x=>x.lg===g.lg && x.id===g.id)) resolved.push(g);
    }
    games = resolved.length ? resolved : MON.choices.slice(0,1);
  } else games = (live.length?live.map(x=>x.g):MON.choices).slice(0,8);
  const same=MON.games.length===games.length && games.every((g,i)=>MON.games[i] && MON.games[i].id===g.id && MON.games[i].lg===g.lg);
  MON.games=games;
  MON.fallback=!live.length;
  if(!same){ MON.gi=0; MON.pi=0; }
  if(MON.gi>=MON.games.length) MON.gi=0;
  const cur=MON.games[MON.gi];
  if(cur){ try{ await monEnsureSum(cur); }catch(e){ MON.err=e.message; } }
  if(tok!==TOKEN) return;
  monDetectFlash(MON.games.filter(isLive));
  if(cur){ try{ await injEnsure([cur.lg]); }catch(_){} }
  MON.panels=cur?monPanelsFor(cur):['score'];
  if(MON.pi>=MON.panels.length) MON.pi=0;
  const nLive=live.length;
  const pinNote=follow==='pin'?(pins.length?`following ${MON.games.length} pinned`:'pinned'):'rotating';
  $('#cnt').textContent=`Monitor · ${nLive?nLive+' live':'no live games'} · ${pinNote}`;
  monPaintSetup();
  monApplyMode();
  setRefresh(MON.games, ()=>{ if(document.hidden){ if(TAB==='monitor') monScheduleHidden(); return; } if(TAB==='monitor') monRefresh(); });
}
function monScheduleHidden(){ clearTimeout(RT); }

}

}
