<!DOCTYPE html>
<html lang="en" data-title="blue" data-scope="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sports Hub">
<meta name="application-name" content="Sports Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<script>
(function(){
  var ok={blue:1,gold:1,purdue:1,crimson:1,emerald:1,purple:1};
  var theme={accent:'blue',scope:'app'};
  try{
    var saved=JSON.parse(localStorage.getItem('sportsHub.theme')||'null');
    if(saved&&ok[saved.accent]) theme.accent=saved.accent;
    if(saved&&(saved.scope==='title'||saved.scope==='app')) theme.scope=saved.scope;
    else if(saved&&saved.accent) theme.scope='app';
  }catch(e){}
  var h=document.documentElement;
  h.setAttribute('data-title', theme.accent);
  h.setAttribute('data-scope', theme.scope);
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content','#000000');
})();
</script>

<title>Sports Hub · Scores &amp; Picks</title>
<style>
:root{
  --bg:#000000;--navy:#0B0D12;--card:#161b24;--line:#343c4e;
  --txt:#e8edf7;--mut:#8a98b5;
  --green:#18c46b;--red:#ff3b4e;--amber:#ff9f1a;--blue:#4c8dff;
  --ok:var(--green);--bad:var(--red);--warn:var(--amber);--court:#ff8a3d;--dng:#ff8b97;--blue-line:var(--blue);
  --header:rgba(0,0,0,.94);--header-solid:#000000;--spot:#10141c;
  --grad-1:#12161e;--grad-2:#000000;--fav-grad:#121820;
  --input:#0B0D12;--chip:#12161e;--hover:#1c2433;--th:#10141c;
  --row-hover:#1c2433;--row-wash:rgba(255,255,255,.04);
  --scrim:rgba(0,0,0,.82);--tip:#161b24;
  --reorder:rgba(0,0,0,.96);--hair:rgba(255,255,255,.06);
  --leg:rgba(0,0,0,.35);--live:#243656;--wpa:#1c2433;
  --mark-ring:#fff;
  --accent-fill:#2563EB;--accent-ink:#fff;--accent-rgb:37 99 235;
  --gold:#2563EB;--gold2:#9EBAFF;
  --tint-rgb:var(--accent-rgb);--stroke:var(--gold);
  --title:#9EBAFF;--title-rgb:158 186 255;
  color-scheme:dark;
}
html[data-title="blue"]{--title:#9EBAFF;--title-rgb:158 186 255}
html[data-title="gold"]{--title:#ffc61a;--title-rgb:255 198 26}
html[data-title="purdue"]{--title:#CFB991;--title-rgb:207 185 145}
html[data-title="crimson"]{--title:#F43F5E;--title-rgb:244 63 94}
html[data-title="emerald"]{--title:#34D399;--title-rgb:52 211 153}
html[data-title="purple"]{--title:#A78BFA;--title-rgb:167 139 250}
html[data-scope="app"][data-title="blue"]{--accent-fill:#2563EB;--accent-ink:#fff;--accent-rgb:37 99 235;--gold:#2563EB;--gold2:#9EBAFF}
html[data-scope="app"][data-title="gold"]{--accent-fill:#ffc61a;--accent-ink:#1a1300;--accent-rgb:255 198 26;--gold:#ffc61a;--gold2:#ffdf6b}
html[data-scope="app"][data-title="purdue"]{--accent-fill:#CFB991;--accent-ink:#1a1408;--accent-rgb:207 185 145;--gold:#CFB991;--gold2:#E7D7B1}
html[data-scope="app"][data-title="crimson"]{--accent-fill:#E11D48;--accent-ink:#fff;--accent-rgb:225 29 72;--gold:#E11D48;--gold2:#FECDD3}
html[data-scope="app"][data-title="emerald"]{--accent-fill:#047857;--accent-ink:#fff;--accent-rgb:4 120 87;--gold:#34D399;--gold2:#6EE7B7}
html[data-scope="app"][data-title="purple"]{--accent-fill:#7C3AED;--accent-ink:#fff;--accent-rgb:124 58 237;--gold:#7C3AED;--gold2:#DDD6FE}
/* Title only: fills and chart strokes stay the preset. Text, borders, and washes are neutral.
   Border gray is #6B7280 (4.3:1 on black) so the header line, tab underline, and focus ring stay visible. */
html[data-scope="title"]{--gold:#6B7280;--gold2:#E5E7EB;--tint-rgb:229 231 235;--stroke:var(--accent-fill)}
html[data-scope="title"][data-title="blue"]{--accent-fill:#2563EB;--accent-ink:#fff;--accent-rgb:37 99 235}
html[data-scope="title"][data-title="gold"]{--accent-fill:#ffc61a;--accent-ink:#1a1300;--accent-rgb:255 198 26}
html[data-scope="title"][data-title="purdue"]{--accent-fill:#CFB991;--accent-ink:#1a1408;--accent-rgb:207 185 145}
html[data-scope="title"][data-title="crimson"]{--accent-fill:#E11D48;--accent-ink:#fff;--accent-rgb:225 29 72}
html[data-scope="title"][data-title="emerald"]{--accent-fill:#047857;--accent-ink:#fff;--accent-rgb:4 120 87}
html[data-scope="title"][data-title="purple"]{--accent-fill:#7C3AED;--accent-ink:#fff;--accent-rgb:124 58 237}
html[data-scope="title"] .themesw.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
html[data-scope="title"] .mondots span.on{box-shadow:0 0 8px rgb(var(--tint-rgb) / .55)}
html[data-scope="title"] .brsep{border-color:var(--gold)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 50% -200px,var(--spot) 0%,var(--bg) 60%) no-repeat var(--bg);color:var(--txt);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--gold2)}
header{position:sticky;top:0;z-index:20;background:var(--header);backdrop-filter:blur(6px);border-bottom:2px solid var(--gold)}
.hbar{padding:10px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:3px;font-size:26px;color:var(--title);text-shadow:0 0 14px rgb(var(--title-rgb) / .45);font-style:italic}
.brand .mark{width:30px;height:30px;border-radius:22%;overflow:hidden;box-shadow:0 0 0 1px var(--mark-ring);flex:none}
.brand .mark svg{width:100%;height:100%;display:block}
.brand small{font-size:11px;letter-spacing:2px;color:var(--mut);font-style:normal;font-weight:700;margin-left:4px}
.upd{font-size:12px;color:var(--mut);text-align:right}
.upd b{color:var(--gold2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px;box-shadow:0 0 6px var(--ok)}
.dot.err{background:var(--bad);box-shadow:0 0 6px var(--bad)}
.dot.idle{background:var(--mut);box-shadow:none}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px;max-width:1240px;margin:0 auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:var(--mut);font-weight:800;letter-spacing:1px;padding:9px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-size:14px}
nav.tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
nav.tabs button .lv{display:inline-block;min-width:16px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--green);color:#03140a;font-size:11px}
main{max-width:1240px;margin:0 auto;padding:14px}
h2{font-size:15px;letter-spacing:3px;color:var(--gold2);margin:22px 0 10px;display:flex;align-items:center;gap:8px;text-transform:uppercase}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
h2:first-child{margin-top:6px}
h3{font-size:13px;letter-spacing:2px;color:var(--gold2);margin:16px 0 8px;text-transform:uppercase}
.parlay{background:linear-gradient(135deg,var(--grad-1),var(--grad-2));border:2px solid var(--gold);border-radius:14px;padding:14px;box-shadow:0 0 24px rgb(var(--tint-rgb) / .15);margin-bottom:12px}
.parlay.lost{border-color:#5a2230;box-shadow:none;opacity:.92}
.parlay.won{border-color:var(--ok)}
.ptop{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ptitle{font-weight:900;font-size:20px;letter-spacing:1px}
.pmeta{color:var(--mut);font-size:13px}
.pmeta b{color:var(--gold2)}
.legs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.leg{background:var(--leg);border:1px solid var(--line);border-radius:10px;padding:10px}
.leg .lt{font-weight:800;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.badge{font-size:11px;font-weight:900;letter-spacing:1px;padding:3px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.b-g{background:var(--green);color:#03140a}.b-r{background:var(--red);color:#fff}.b-n{background:#2a3a5c;color:#cfd8ea}.b-gold{background:var(--accent-fill);color:var(--accent-ink)}.b-a{background:var(--amber);color:#1a0d00}.b-b{background:var(--blue);color:#fff}
.tstat{font-size:18px;font-weight:900;padding:6px 14px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.g{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;position:relative}
.g.live{border-color:var(--live)}
.g.close{border-color:var(--amber);box-shadow:0 0 12px rgba(255,159,26,.3)}
.g.upset{border-color:var(--bad);box-shadow:0 0 14px rgba(255,59,78,.35)}
.g.fav{border:2px solid var(--gold);box-shadow:0 0 16px rgb(var(--tint-rgb) / .28);background:linear-gradient(135deg,var(--fav-grad),var(--card))}
.g.ffg{border-color:var(--blue-line);box-shadow:0 0 12px rgba(76,141,255,.3)}
.g.fav.ffg{border-color:var(--gold)}
.g .lgtag{font-size:10px;letter-spacing:2px;color:var(--mut);font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:8px;padding:3px 0}
.row img{width:24px;height:24px;object-fit:contain}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rbtn{flex:none;background:none;border:1px solid var(--line);color:var(--gold2);border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.4px;padding:1px 6px;cursor:pointer;line-height:1.4}
.rbtn:hover,.rbtn:focus-visible{border-color:var(--gold);color:var(--gold2)}
html.touch .rbtn{min-height:32px;min-width:44px;font-size:12px;padding:4px 8px;position:relative}
html.touch .rbtn::after{content:"";position:absolute;inset:-8px}
.row .rk{color:var(--gold2);font-size:11px;font-weight:800;margin-right:3px}
.row .rec{color:var(--mut);font-size:11px;margin-left:4px;font-weight:400}
.row .sc{font-weight:900;font-size:20px;min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
.row.lose .sc,.row.lose .nm{color:var(--mut)}
.row.favt .nm{color:var(--gold2)}
.pos{color:var(--gold2);font-size:13px;margin-left:3px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--mut);border-top:1px solid var(--line);padding-top:6px}
.g.manual .foot{flex-wrap:wrap;row-gap:6px}
.g.manual .links{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.foot .st{font-weight:800;color:var(--txt)}
.foot .st.l{color:var(--ok)}
.foot .addslip{background:none;border:1px solid var(--line);color:var(--gold2);border-radius:6px;font-size:11px;padding:1px 6px;cursor:pointer;font-weight:800}
.foot .addslip:hover{border-color:var(--gold)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.sit{font-size:11px;color:var(--gold2);margin-top:4px}
.errbox{color:var(--bad);font-weight:700;padding:10px;border:1px solid var(--bad);border-radius:8px;margin:0 0 10px;display:none}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button,.btn{background:var(--navy);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;cursor:pointer;font-size:13px}
.filters button.on,.btn.pri{background:var(--accent-fill);color:var(--accent-ink);border-color:var(--accent-fill)}
.btn.sm{padding:2px 9px;font-size:12px}
.btn.dng{border-color:#5a2230;color:var(--dng)}
.btn:disabled{opacity:.45;cursor:default}
.navbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--navy);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.navbar .lbl{font-weight:900;font-size:17px;letter-spacing:1px;flex:1;min-width:160px}
.navbar .lbl small{display:block;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:0}
input,select,textarea{background:var(--input);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:2px;border-color:var(--gold)}
input[type=date]{color-scheme:inherit}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mut);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.empty{color:var(--mut);padding:18px;border:1px dashed var(--line);border-radius:10px;text-align:center}
.empty b{color:var(--gold2)}
.panel{background:var(--navy);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 8px;font-size:13px;font-weight:600}
.chip img{width:18px;height:18px;object-fit:contain}
.chip button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:14px;padding:0 2px}
.chip button:hover{color:var(--bad)}
.results{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px;display:none}
.results div{padding:5px 8px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:13px}
.results div:hover{background:var(--hover)}
.results img{width:18px;height:18px;object-fit:contain}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.themerow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.themesw{display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;line-height:1.2}
.themesw i{width:14px;height:14px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.28);flex:none}
.themesw.on{border-color:var(--accent-fill);box-shadow:0 0 0 1px var(--accent-fill);color:var(--gold2)}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pcard{display:flex;gap:12px;align-items:flex-start}
.pcard .hs{width:74px;height:54px;object-fit:cover;object-position:top;border-radius:8px;background:var(--navy);border:1px solid var(--line)}
.pcard .pn{font-weight:900;font-size:17px}
.pcard .pt{font-size:12px;color:var(--mut)}
.statline{display:flex;gap:12px;margin-top:6px}
.statline div{text-align:center}
.statline b{display:block;font-size:22px;font-weight:900;color:var(--gold2);font-variant-numeric:tabular-nums}
.statline span{font-size:10px;letter-spacing:2px;color:var(--mut);font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi span{font-size:11px;letter-spacing:2px;color:var(--mut);font-weight:800;text-transform:uppercase}
.kpi b{display:block;font-size:22px;font-weight:900;margin-top:2px}
.pl-pos{color:var(--ok)}.pl-neg{color:var(--bad)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{background:var(--th);color:var(--gold2);font-size:11px;letter-spacing:1px;text-transform:uppercase;position:sticky;top:0}
td.wrap{white-space:normal;min-width:200px}
td .sub{display:block;font-size:11px;color:var(--mut)}
tr.demo td{background:rgba(76,141,255,.06)}
.legrow{display:grid;grid-template-columns:90px 140px minmax(200px,1.6fr) 110px minmax(140px,1fr) 80px 80px 30px;gap:6px;align-items:end;margin-bottom:6px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.note{font-size:12px;color:var(--mut)}
.demo-ribbon{background:var(--blue);color:#fff;font-weight:900;letter-spacing:2px;font-size:11px;padding:3px 8px;border-radius:6px}
.ffpanel{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
footer{color:var(--mut);font-size:11px;text-align:center;padding:24px 10px}
.hide{display:none!important}
.g,.parlay{position:relative}
.dh{position:absolute;top:0;left:50%;transform:translateX(-50%);width:46px;height:13px;line-height:11px;padding:0;border:0;border-radius:0 0 6px 6px;background:rgb(var(--tint-rgb) / .10);color:var(--mut);font-size:10px;letter-spacing:1px;cursor:grab;touch-action:none;opacity:.55;z-index:2}
.dh:hover,.dh:focus{opacity:1;color:var(--gold2);background:rgb(var(--tint-rgb) / .22)}
@media (hover:none){.dh{opacity:.9;height:16px}}
.dragging{opacity:.55;outline:2px dashed var(--gold);outline-offset:2px}
body.dragging-on{user-select:none;-webkit-user-select:none;cursor:grabbing}
body.dragging-on .dh{cursor:grabbing}
.syncbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:13px;border:1px solid var(--line);background:var(--navy)}
.syncbar.ok{border-color:#1d5b3c}.syncbar.warn{border-color:var(--amber);color:var(--gold2)}

const JC = new Map();  // fetch cache: url -> {t, data}
async function getJSON(url, maxAge=0){
  const c = JC.get(url); if(c && (maxAge<0 || Date.now()-c.t < maxAge)) return c.data;

  if(g.statusName==='STATUS_HALFTIME') return 'Halftime';
  if(g.statusName==='STATUS_END_PERIOD') return 'End '+periodTxt(g);
  if(g.statusName && g.statusName!=='STATUS_IN_PROGRESS' && !/^\d/.test(g.detail)) return g.detail;

// Order is saved per view in localStorage as a list of stable ids (event id, team:<id>, p:<id>, bet id).
// Items without a saved position go after the ordered ones; ids that no longer exist are ignored/pruned.
const ORD = {
  get(k){ try{ return JSON.parse(localStorage.getItem('sportsHub.order.'+k)||'null'); }catch(_){ return null; } },
  set(k,arr){ try{ localStorage.setItem('sportsHub.order.'+k, JSON.stringify(arr));
    const idx=JSON.parse(localStorage.getItem('sportsHub.orderIdx')||'{}'); idx[k]=Date.now();
    const keys=Object.keys(idx).sort((a,b)=>idx[b]-idx[a]); keys.slice(80).forEach(x=>{ localStorage.removeItem('sportsHub.order.'+x); delete idx[x]; });
    localStorage.setItem('sportsHub.orderIdx', JSON.stringify(idx)); }catch(_){} },
  clear(k){ try{ localStorage.removeItem('sportsHub.order.'+k); }catch(_){} },
  apply(k, items, sidOf=x=>x){ const sv=this.get(k); if(!sv||!sv.length) return items.slice();
    const pos=new Map(sv.map((x,i)=>[String(x),i]));
    const a=items.filter(x=>pos.has(String(sidOf(x)))).sort((x,y)=>pos.get(String(sidOf(x)))-pos.get(String(sidOf(y))));
    return a.concat(items.filter(x=>!pos.has(String(sidOf(x))))); }
};

let DRAG = null;
function itemIn(el, cont){ while(el && el.parentElement!==cont) el=el.parentElement; return el && el.dataset && el.dataset.sid ? el : null; }
document.addEventListener('pointerdown', e=>{
  const h=e.target.closest('.dh'); if(!h) return;
  const item=h.closest('[data-sid]'), cont=item&&item.parentElement; if(!cont||!cont.dataset.sort) return;
  e.preventDefault(); try{ h.setPointerCapture(e.pointerId); }catch(_){}

  const el=document.elementFromPoint(e.clientX, e.clientY); const tgt=el&&itemIn(el, DRAG.cont);
  if(tgt && tgt!==DRAG.item){ const kids=[...DRAG.cont.children]; const after = kids.indexOf(tgt) > kids.indexOf(DRAG.item);
    DRAG.cont.insertBefore(DRAG.item, after ? tgt.nextSibling : tgt); DRAG.moved=true; }

function endDrag(e){
  if(!DRAG || (e && e.pointerId!==DRAG.pid)) return;

let LASTDRAG=0;
function persistOrder(cont){   // save a container's on-screen order (same localStorage key for mouse drag, touch drag and ▲▼)
  const key=cont.dataset.sort, all=(cont.dataset.all||'').split(',').filter(Boolean);
  const visible=[...cont.children].map(x=>x.dataset&&x.dataset.sid).filter(Boolean);
  const full=ORD.apply(key, all.concat(visible.filter(v=>!all.includes(v))));
  const vis=new Set(visible), slots=[]; full.forEach((x,i)=>{ if(vis.has(x)) slots.push(i); });
  const out=full.slice(); slots.forEach((slot,j)=>out[slot]=visible[j]);   // hidden (filtered-out) items keep their slots

}

function moveItem(btn, dir){

const SHEET_BG_MS = 2*60e3, SHEET_BG_TABS = ['mine','cfb','cbb','nfl','nba','fantasy','highlights','monitor','injuries'];

// Auto-refresh only while something is live (or a start time has just passed).
function setRefresh(games, fn){

  const live = games.some(isLive) || games.some(g=>g.state==='pre' && g.date<=now && now-g.date<4*3600e3);
  if(!fn){ $('#rf').textContent=''; return; }
  const run=()=>{ if(tok!==TOKEN) return; if(DRAG){ RT=setTimeout(run, 2000); return; } fn(); };
  if(live){ RT=setTimeout(run, REFRESH_MS); $('#rf').innerHTML='· <b style="color:var(--ok)">auto-refresh 30s (live)</b>'; return; }
  const next = games.filter(g=>g.state==='pre' && g.date>now).map(g=>+g.date).sort((a,b)=>a-b)[0];
  if(next && next-now < 12*3600e3){ RT=setTimeout(run, next-now+20000); $('#rf').textContent='· auto-refresh resumes at next start ('+fmtTime(new Date(next))+')'; }
  else $('#rf').textContent='· auto-refresh paused (nothing live)';
}

const TEAMLIST = {};

async function searchTeams(lg, q){
  const d = await getJSON('https://site.web.api.espn.com/apis/search/v2?limit=25&type=team&query='+encodeURIComponent(q), 60000);
  const out=[];
  (d.results||[]).forEach(r=>(r.contents||[]).forEach(c=>{ const m=/t:(\d+)/.exec(c.uid||''); if(m && SLUG2LG[c.defaultLeagueSlug]===lg) out.push({id:m[1], name:c.displayName, abbr:'', logo:(c.image&&c.image.default)||''}); }));
  out.forEach(t=>{ (TEAMLIST[lg]=TEAMLIST[lg]||[]); if(!TEAMLIST[lg].some(x=>x.id===t.id)) TEAMLIST[lg].push(t); });
  return out;
}
async function nflTeams(){
  const d = await getJSON(API+'football/nfl/groups', -1); const acc=[];
  const walk=x=>{ if(Array.isArray(x)) x.forEach(walk); else if(x&&typeof x==='object'){ if(Array.isArray(x.teams)) x.teams.forEach(t=>acc.push({id:String(t.id),name:t.displayName,abbr:t.abbreviation})); Object.entries(x).forEach(([k,v])=>{ if(k!=='teams') walk(v); }); } };
  walk(d); return acc.sort((a,b)=>a.name.localeCompare(b.name));
}
async function teamGames(lg, id){
  const p = API+LG[lg].path+'/teams/'+id;
  const sch = await getJSON(p+'/schedule', 60000);
  let raw = sch.events||[];
  const now0=Date.now();
  const done = e=>{ const t=(((e.competitions||[])[0]||{}).status||{}).type||{}; return t.completed||t.state==='post'; };
  // Default schedule = current season type. Before/after it (preseason, postseason) also pull the other types
  // so "next game" and "last game" stay filled in.
  if(!raw.some(e=>+new Date(e.date)>now0-6*3600e3) || !raw.some(done)){
    for(const st of [1,2,3]){ try{ const x=await getJSON(p+'/schedule?seasontype='+st, 60000); raw=raw.concat(x.events||[]); }catch(_){} }
  }
  const seen=new Set(), all=[];
  raw.forEach(e=>{ if(!e||seen.has(String(e.id))) return; seen.add(String(e.id)); all.push(normEvent(e,lg)); });
  all.sort((a,b)=>a.date-b.date);
  const now=Date.now(), today=isoDay(new Date());
  const live = all.find(isLive);
  const todays = all.find(g=>isoDay(g.date)===today);
  const next = all.find(g=>g.state==='pre' && +g.date > now-6*3600e3);
  const last = [...all].reverse().find(g=>g.state==='post');
  const team = sch.team || {};
  let cur = live || todays || null;
  if(cur && cur.state!=='post'){ try{ cur = await summaryEvent(lg, cur.id) || cur; }catch(_){} }  // fresher live score
  return {cur, next, last, team, all};
}

// ---------------- FANTASY (Yahoo-style points from ESPN box scores; no Yahoo connection) ----------------
const FSC = ()=>DATA.settings.fantasyScoring||FANTASY_YAHOO;
const FV = {nav:null};   // fantasy week selector
const normName = n=>String(n||'').toLowerCase().replace(/[^a-z ]/g,'').replace(/\b(jr|sr|ii|iii|iv|v)\b/g,'').replace(/\s+/g,' ').trim();
const r2 = n=>Math.round(n*100)/100;
function boxFind(sum, r){ // -> {teamAbbr, cats:{name:{label:value}}} for one athlete (by ESPN id, else by name)
  const out={cats:{}, found:false}; const nm=normName(r.name);
  for(const t of ((sum.boxscore||{}).players||[])) for(const c of (t.statistics||[])) for(const a of (c.athletes||[])){
    const ath=a.athlete||{};
    if((r.athleteId && String(ath.id)===String(r.athleteId)) || (!r.athleteId && normName(ath.displayName)===nm)){
      out.found=true; out.teamId=String((t.team||{}).id||''); out.name=ath.displayName;
      const o={}; (c.labels||[]).forEach((l,i)=>o[l]=(a.stats||[])[i]); out.cats[c.name]=o; }
  }
  return out;
}
const num0 = v=>{ const n=parseFloat(v); return Number.isFinite(n)?n:0; };
function twoPointConvs(sum, fullName){ // ESPN scoring-play text, e.g. "(Dak Prescott Pass to CeeDee Lamb for Two-Point Conversion)"
  const nm=normName(fullName); let n=0;
  (sum.scoringPlays||[]).forEach(sp=>{ const m=/\(([^()]*?)\s+for Two-Point Conversion\)/i.exec(sp.text||''); if(!m||/failed/i.test(m[1])) return;
    const parts=m[1].split(/\s+(?:pass to|run|rush)\b/i).map(normName).filter(Boolean); if(parts.includes(nm)) n++; });
  return n;
}
function fieldGoals(sum, fullName){ const nm=normName(fullName); const out=[];
  (sum.scoringPlays||[]).forEach(sp=>{ const m=/^(.+?)\s+(\d+)\s+Yd\s+Field Goal/i.exec(sp.text||''); if(m && normName(m[1])===nm) out.push(+m[2]); }); return out; }
function playerPoints(sum, r){
  const S=FSC(), b=boxFind(sum, r); if(!b.found) return null;
  const P=b.cats.passing||{}, R=b.cats.rushing||{}, C=b.cats.receiving||{}, F=b.cats.fumbles||{}, K=b.cats.kicking||{}, KR=b.cats.kickReturns||{}, PR=b.cats.puntReturns||{};
  const parts=[], add=(lbl,qty,per)=>{ if(qty) parts.push({lbl,qty,pts:qty*per}); };
  const pyd=num0(P.YDS), ptd=num0(P.TD), pint=num0(P.INT), ryd=num0(R.YDS), rtd=num0(R.TD), rec=num0(C.REC), cyd=num0(C.YDS), ctd=num0(C.TD), fl=num0(F.LOST), ret=num0(KR.TD)+num0(PR.TD);
  add('Pass yds',pyd,S.passYd); add('Pass TD',ptd,S.passTD); add('INT',pint,S.passInt); add('Rush yds',ryd,S.rushYd); add('Rush TD',rtd,S.rushTD);
  add('Rec',rec,S.rec); add('Rec yds',cyd,S.recYd); add('Rec TD',ctd,S.recTD); add('Ret TD',ret,S.retTD); add('Fum lost',fl,S.fumLost);
  const tp=twoPointConvs(sum, b.name); add('2-pt',tp,S.twoPt);
  let line=[];
  if(P['C/ATT']) line.push(`${P['C/ATT']}, ${pyd} yds, ${ptd} TD${pint?`, ${pint} INT`:''}`);
  if(R.CAR && (num0(R.CAR)||ryd)) line.push(`${R.CAR} car, ${ryd} yds${rtd?`, ${rtd} TD`:''}`);
  if(C.REC!=null && (rec||cyd)) line.push(`${rec} rec, ${cyd} yds${ctd?`, ${ctd} TD`:''}`);
  if(K.FG){ const fgs=fieldGoals(sum,b.name), made=num0(String(K.FG).split('/')[0]);
    const bucket=d=>d<=19?S.fg0_19:d<=29?S.fg20_29:d<=39?S.fg30_39:d<=49?S.fg40_49:S.fg50;
    fgs.forEach(d=>parts.push({lbl:`FG ${d}`,qty:1,pts:bucket(d)}));
    if(made>fgs.length) parts.push({lbl:`FG (distance unknown)`,qty:made-fgs.length,pts:(made-fgs.length)*S.fg30_39});
    const xp=num0(String(K.XP||'0').split('/')[0]); add('PAT',xp,S.pat);
    line.push(`FG ${K.FG}${fgs.length?' ('+fgs.join(', ')+')':''}, XP ${K.XP}`); }
  if(fl) line.push(`${fl} fum lost`); if(tp) line.push(`${tp} 2-pt`); if(ret) line.push(`${ret} ret TD`);
  return {pts:r2(parts.reduce((a,x)=>a+x.pts,0)), parts, line:line.join(' · ')||'no stats'};
}
function dstPoints(sum, teamId){
  const S=FSC(); const comp=(((sum.header||{}).competitions)||[])[0]; if(!comp) return null;
  const me=comp.competitors.find(c=>String(c.team.id)===String(teamId)), opp=comp.competitors.find(c=>String(c.team.id)!==String(teamId)); if(!me||!opp) return null;
  const tstat=(id,name)=>{ const t=((sum.boxscore||{}).teams||[]).find(x=>String(x.team.id)===String(id)); const st=t&&(t.statistics||[]).find(x=>x.name===name); return st?st.displayValue:null; };
  const pa=num0(opp.score), sacks=num0(String(tstat(opp.team.id,'sacksYardsLost')||'0').split('-')[0]), ints=num0(tstat(opp.team.id,'interceptions')), fr=num0(tstat(opp.team.id,'fumblesLost'));
  let tds=num0(tstat(teamId,'defensiveTouchdowns'));
  ((sum.boxscore||{}).players||[]).filter(t=>String(t.team.id)===String(teamId)).forEach(t=>(t.statistics||[]).filter(c=>c.name==='kickReturns'||c.name==='puntReturns').forEach(c=>(c.athletes||[]).forEach(a=>{ const i=(c.labels||[]).indexOf('TD'); tds+=num0((a.stats||[])[i]); })));
  const safeties=(sum.scoringPlays||[]).filter(sp=>/safety/i.test(((sp.type||{}).text)||'') && String((sp.team||{}).id)===String(teamId)).length;
  const tier = pa===0?S.pa0:pa<=6?S.pa1_6:pa<=13?S.pa7_13:pa<=20?S.pa14_20:pa<=27?S.pa21_27:pa<=34?S.pa28_34:S.pa35;
  const parts=[{lbl:`${pa} pts allowed`,qty:1,pts:tier}]; const add=(l,q,p)=>{ if(q) parts.push({lbl:l,qty:q,pts:q*p}); };
  add('Sacks',sacks,S.dstSack); add('INT',ints,S.dstInt); add('Fum rec',fr,S.dstFR); add('TD',tds,S.dstTD); add('Safety',safeties,S.dstSafety);
  return {pts:r2(parts.reduce((a,x)=>a+x.pts,0)), parts, line:`${pa} PA · ${sacks} sk · ${ints} INT · ${fr} FR${tds?` · ${tds} TD`:''}${safeties?` · ${safeties} SFTY`:''}`};
}
const isDST = r=>r.pos==='DST';
async function fantasyWeek(){
  const L=LG.nfl; const q=[]; if(FV.nav) q.push(`seasontype=${FV.nav.st}`,`week=${FV.nav.week}`,`dates=${FV.nav.year}`);
  const d=await getJSON(API+L.path+'/scoreboard'+(q.length?'?'+q.join('&'):''), 20000);
  const games=remember((d.events||[]).map(e=>normEvent(e,'nfl')));
  const weeks=flattenWeeks((d.leagues||[])[0]&&d.leagues[0].calendar).filter(w=>w.st!=='1'||true);
  const cur={st:String((d.season||{}).type||''), week:String((d.week||{}).number||''), year:(d.season||{}).year};
  const byes=new Set((((d.week||{}).teamsOnBye)||[]).map(t=>String(t.id)));
  const roster=DATA.fantasy.roster||[];
  const sums=new Map();
  await Promise.all([...new Set(roster.map(r=>{ const g=games.find(x=>involves(x,r.teamId)); return g&&g.state!=='pre'?g.id:null; }).filter(Boolean))].map(async id=>{ try{ sums.set(id, await summary('nfl',id)); }catch(_){} }));
  const rows=roster.map((r,i)=>{
    const g=r.teamId?games.find(x=>involves(x,r.teamId)):null;
    const row={i, r, g, status:'', pts:null, line:'', parts:[]};
    if(!r.teamId){ row.status='no team'; return row; }
    if(!g){ row.status = byes.has(String(r.teamId))||games.length ? 'bye' : 'no game'; return row; }
    if(g.state==='pre'){ row.status='not started'; return row; }
    const sum=sums.get(g.id); if(!sum){ row.status=g.state==='in'?'live':'final'; row.line='box score unavailable'; return row; }
    const res = isDST(r) ? dstPoints(sum, r.teamId) : playerPoints(sum, r);
    if(!res){ row.status='inactive'; row.pts=0; row.line='not in box score (inactive / DNP)'; return row; }
    row.status=g.state==='in'?'live':'final'; row.pts=res.pts; row.line=res.line; row.parts=res.parts; return row;
  });
  return {games, weeks, cur, rows};
}

function espnURL(u){ try{ const x=new URL(u); return x.protocol==='https:' && /(^|\.)espn\.com$/i.test(x.hostname) ? x.href : null; }catch(_){ return null; } }
function espnImg(u){ try{ const x=new URL(u); return x.protocol==='https:' && /(^|\.)(espn\.com|espncdn\.com|akamaized\.net)$/i.test(x.hostname) ? x.href : ''; }catch(_){ return ''; } }
const fmtDur = s=>{ s=Math.round(+s||0); if(!s) return ''; const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+pad(m):m)+':'+pad(x); };
function hlFromNews(a, lg){
  if(!a || a.type!=='Media') return null;
  const url = espnURL(a.links&&a.links.web&&a.links.web.href); if(!url) return null;
  const cats = a.categories||[], ev = cats.find(c=>c.type==='event'&&c.eventId);
  return { id:String(a.id), lg, headline:a.headline||a.description||'Video', thumb:espnImg(((a.images||[])[0]||{}).url), url,
    published:a.published?new Date(a.published):null, duration:a.duration||null,
    eventId:ev?String(ev.eventId):'', eventName:ev?(ev.description||''):'',
    teamIds:[...new Set(cats.filter(c=>c.type==='team'&&c.teamId).map(c=>String(c.teamId)))],
    athleteIds:[...new Set(cats.filter(c=>c.type==='athlete'&&c.athleteId).map(c=>String(c.athleteId)))] };
}
function hlFromSummary(v, lg, g){
  const url = espnURL(v.links&&v.links.web&&v.links.web.href); if(!url) return null;
  const d = v.originalPublishDate||v.lastModified;
  return { id:String(v.id), lg, headline:v.headline||v.description||'Video', thumb:espnImg(v.thumbnail), url, published:d?new Date(d):null,
    duration:v.duration||null, eventId:g?String(g.id):'', eventName:g?`${g.away.name} at ${g.home.name}`:'', teamIds:g?[g.home.id,g.away.id]:[], athleteIds:[] };
}
function hlMerge(map, x){
  if(!x) return; const o=map.get(x.id);
  if(!o){ map.set(x.id,x); return; }
  ['duration','thumb','eventId','eventName','published'].forEach(k=>{ if(!o[k] && x[k]) o[k]=x[k]; });
  o.teamIds=[...new Set(o.teamIds.concat(x.teamIds))]; o.athleteIds=[...new Set(o.athleteIds.concat(x.athleteIds))];
}
async function gameVideos(lg, evId){ // summary videos for one game, normalized (cached by summary())
  const d = await summary(lg, evId); let g=null; try{ g = await summaryEvent(lg, evId); }catch(_){}
  return (d.videos||[]).map(v=>hlFromSummary(v, lg, g)).filter(Boolean);
}
const HL = { items:null, t:0, failed:[], ctx:null };
async function hlContext(){ // who counts as "mine": My Teams, favorite players (+ their current team), fantasy roster
  const teams={}, plTeams={}, players={}, ff={nfl:{}}, ffNames=[], plList=[];
  HL_LGS.forEach(lg=>{ teams[lg]=new Map((DATA.myTeams[lg]||[]).map(t=>[String(t.id), t.name||t.abbr||'My team'])); plTeams[lg]=new Map(); players[lg]=new Map(); });
  await Promise.all(DATA.favoritePlayers.map(async p=>{ if(!players[p.league]) return; players[p.league].set(String(p.id), p.name);
    let teamId=null; try{ const i=await playerInfo(p); if(i.team&&i.active){ teamId=String(i.team.id); plTeams[p.league].set(teamId, {team:i.team.shortDisplayName||i.team.displayName||'', player:i.name}); } }catch(_){}
    plList.push({lg:p.league, name:p.name, teamId}); }));
  (DATA.fantasy.roster||[]).forEach(r=>{ if(r.athleteId) ff.nfl[String(r.athleteId)]=r.name; else if(r.name && r.pos!=='DST') ffNames.push(r.name); });
  return {teams, plTeams, players, ff, ffNames, plList};
}
function hlReasons(x, ctx){
  const out=[], lg=x.lg; if(!ctx) return out;
  x.teamIds.forEach(id=>{ const n=ctx.teams[lg]&&ctx.teams[lg].get(id); if(n) out.push('⭐ '+n); });
  x.athleteIds.forEach(id=>{ const n=ctx.players[lg]&&ctx.players[lg].get(id); if(n) out.push('👑 '+n); });
  { const hw=' '+normName(x.headline)+' ';   // headline mentions: full name anywhere, or first/last name on a clip tagged with his team
    (ctx.plList||[]).filter(p=>p.lg===lg).forEach(p=>{ const nm=normName(p.name), parts=nm.split(' ').filter(w=>w.length>=4);
      const onTeam=p.teamId && x.teamIds.includes(p.teamId);
      if(hw.includes(' '+nm+' ') || (onTeam && parts.some(w=>hw.includes(' '+w+' ')))) out.push('👑 '+p.name); }); }
  x.teamIds.forEach(id=>{ const p=ctx.plTeams[lg]&&ctx.plTeams[lg].get(id); if(p && !out.includes('👑 '+p.player)) out.push(`👑 ${p.team} (${p.player})`); });
  if(lg==='nfl'){ x.athleteIds.forEach(id=>{ if(ctx.ff.nfl[id]) out.push('🏆 FF: '+ctx.ff.nfl[id]); });
    const h=normName(x.headline); ctx.ffNames.forEach(n=>{ const k=normName(n); if(k.length>4 && h.includes(k) && !out.includes('🏆 FF: '+n)) out.push('🏆 FF: '+n); }); }
  return [...new Set(out)];
}
async function loadHighlights(force){
  if(HL.items && !force && Date.now()-HL.t<300000) return HL;
  const map=new Map(), failed=[];
  const ctx = await hlContext();
  const jobs = HL_LGS.map(lg=>getJSON(API+LG[lg].path+'/news?limit=50', force?0:300000).then(d=>(d.articles||[]).forEach(a=>hlMerge(map, hlFromNews(a,lg)))).catch(()=>failed.push(LG[lg].short)));
  // Team feeds: My Teams + favorite players' current teams + fantasy roster teams (NFL), capped to keep requests modest.
  const tq=[]; const addT=(lg,id)=>{ if(id && !tq.some(x=>x[0]===lg&&x[1]===String(id))) tq.push([lg,String(id)]); };
  HL_LGS.forEach(lg=>{ ctx.teams[lg].forEach((_,id)=>addT(lg,id)); ctx.plTeams[lg].forEach((_,id)=>addT(lg,id)); });
  (DATA.fantasy.roster||[]).forEach(r=>addT('nfl', r.teamId));
  const LGFEED = {cbb:'basketball/mens-college-basketball'};
  tq.slice(0,14).forEach(([lg,id])=>jobs.push(getJSON(API+(LGFEED[lg]||LG[lg].path)+'/news?limit=50&team='+id, force?0:300000).then(d=>(d.articles||[]).forEach(a=>hlMerge(map, hlFromNews(a,lg)))).catch(()=>{})));
  // Game summaries (these carry clip durations): current/last game of My Teams and favorite players' teams.
  const gq=[]; HL_LGS.forEach(lg=>{ ctx.teams[lg].forEach((_,id)=>gq.push([lg,id])); ctx.plTeams[lg].forEach((_,id)=>gq.push([lg,id])); });
  gq.slice(0,8).forEach(([lg,id])=>jobs.push(teamGames(lg,id).then(async r=>{ const g=r.cur&&r.cur.state!=='pre'?r.cur:r.last; if(g) (await gameVideos(lg,g.id)).forEach(x=>hlMerge(map,x)); }).catch(()=>{})));
  await Promise.all(jobs);
  HL.items=[...map.values()].sort((a,b)=>(b.published||0)-(a.published||0)); HL.t=Date.now(); HL.failed=failed; HL.ctx=ctx;
  return HL;
}

    <a class="hlthumb" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" title="Watch on ESPN (opens a new tab)">${x.thumb?`<img loading="lazy" src="${esc(x.thumb)}" alt="">`:'<div class="nothumb">🎬</div>'}<span class="play">▶</span>${x.duration?`<span class="dur">${fmtDur(x.duration)}</span>`:''}</a>

      ${x.eventId&&!opts.noDetail?`<button class="btn sm" data-gd="${esc(x.eventId)}" data-lg="${x.lg}">Game details</button>`:''}</div></div>`;

// ---------------- INJURIES (ESPN league injury reports + game summaries; cached for offline, refreshed at most every 15 min) ----------------
// Sources, all CORS-open from file:// (checked in headless Chrome, Oct 18 2026):
//  • site.api.espn.com/apis/site/v2/sports/{sport}/{league}/injuries — league-wide, grouped by team, with comments. NFL/NBA have data;
//    college football returns only a few years-old items, men's college basketball returns an empty list.
//  • the game summary's `injuries` array — per team, newest 5 per team, with athlete ids, no comments (NFL/NBA only; college summaries have none).
const INJ_KEY='sportsHub.injuries.v1', INJ_TTL=15*60e3, INJ_RETRY=2*60e3, INJ_STALE_DAYS=365;
let INJ = (()=>{ try{ return JSON.parse(localStorage.getItem(INJ_KEY)||'null')||{}; }catch(_){ return {}; } })();   // lg -> {at, tried, err, entries, teams, total, active, stale}
const INJP = {}, INJSUM = {};   // in-flight fetches; lg -> Map(athleteId -> entry) seen in game summaries this session
let INJIDX = {}, INJT = null;
const INJ_ST = [
  {k:'out',  lbl:'Out',          s:'OUT',  cls:'inj-out', re:/^out\b/i},
  {k:'ir',   lbl:'IR',           s:'IR',   cls:'inj-ir',  re:/injured reserve|^ir\b|physically unable|non-football/i},
  {k:'doubtful', lbl:'Doubtful', s:'D',    cls:'inj-d',   re:/doubtful/i},
  {k:'questionable', lbl:'Questionable', s:'Q', cls:'inj-q', re:/questionable/i},
  {k:'dtd',  lbl:'Day-to-day',   s:'DTD',  cls:'inj-dtd', re:/day[- ]to[- ]day/i},
  {k:'probable', lbl:'Probable', s:'P',    cls:'inj-p',   re:/probable/i},
  {k:'susp', lbl:'Suspended',    s:'SUSP', cls:'inj-sus', re:/suspen/i}
];
function injStatus(s){ s=String(s||'').trim(); if(!s || /^active$/i.test(s)) return null; return INJ_ST.find(x=>x.re.test(s)) || {k:'other', lbl:s, s:s.slice(0,6).toUpperCase(), cls:'inj-o'}; }
const injRank = e=>{ const s=injStatus(e.status); const i=s?INJ_ST.indexOf(s):-1; return i<0?99:i; };
const injCmt = c=>{ c=String(c||'').trim(); return /\s/.test(c) ? c : /^inactive$/i.test(c) ? 'Game-day inactive' : ''; };   // ESPN fills some notes with one placeholder word ("questionable")
function injNorm(x, team){ // one ESPN injury item (league report or summary) -> compact entry
  const a=x.athlete||{}, link=((a.links||[])[0]||{}).href||'', t=a.team||team||{}, det=x.details||{};
  return { id:String(a.id || (/\/id\/(\d+)/.exec(link)||[])[1] || ''), name:a.displayName||a.fullName||'', short:a.shortName||'', pos:(a.position||{}).abbreviation||'',
    teamId:String(t.id||(team&&team.id)||''), team:t.abbreviation||'', teamName:t.displayName||(team&&team.displayName)||'',
    status:x.status||((x.type||{}).description||''), date:x.date||'', type:det.type||'', side:det.side&&!/not specified/i.test(det.side)?det.side:'',
    ret:det.returnDate||'', sc:injCmt(x.shortComment).slice(0,400), lc:injCmt(x.longComment).slice(0,700) };
}
async function injFetch(lg){
  const r=await fetch(API+LG[lg].path+'/injuries?_='+Date.now(), {cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
  const d=await r.json(), cut=Date.now()-INJ_STALE_DAYS*864e5; let total=0, active=0, stale=0, maxPer=0; const entries=[], teams=[];
  (d.injuries||[]).forEach(t=>{ let abbr=''; maxPer=Math.max(maxPer,(t.injuries||[]).length);
    (t.injuries||[]).forEach(x=>{ total++; const e=injNorm(x,{id:t.id, displayName:t.displayName}); abbr=abbr||e.team;
      if(!injStatus(e.status)){ active++; return; }                               // "Active" = a news note, not an injury
      if(e.date && Date.parse(e.date)<cut){ stale++; return; }                    // years-old leftovers (seen in college football)
      entries.push(e); });
    teams.push({id:String(t.id), name:t.displayName||'', abbr}); });
  return {at:new Date().toISOString(), err:null, entries, teams, total, active, stale, maxPer, season:(d.season||{}).displayName||''};
}
function injSave(){ try{ localStorage.setItem(INJ_KEY, JSON.stringify(INJ)); }catch(e){ console.warn('injury cache not saved', e); } }
function injEnsure(lgs=LGS, force=false){ // fetch league reports that are older than 15 min (2 min after a failure); concurrent callers share one request
  return Promise.all(lgs.filter(lg=>LG[lg]).map(lg=>{ const c=INJ[lg];
    if(INJP[lg]) return INJP[lg];
    if(!force && c && c.tried && Date.now()-Date.parse(c.tried) < (c.err?INJ_RETRY:INJ_TTL)) return null;
    return INJP[lg]=injFetch(lg).then(v=>{ INJ[lg]=Object.assign(v,{tried:v.at}); })
      .catch(e=>{ INJ[lg]=Object.assign({entries:[],teams:[]}, INJ[lg]||{}, {err:e.message, tried:new Date().toISOString()}); })
      .finally(()=>{ delete INJP[lg]; INJIDX={}; injSave(); });
  })).then(()=>INJ);
}
function injAddSummary(lg, d){ // summary injuries (newest 5 per team) fill in until/beyond the league report
  const m=INJSUM[lg]=INJSUM[lg]||new Map(); let n=0;
  ((d&&d.injuries)||[]).forEach(t=>(t.injuries||[]).forEach(x=>{ const e=injNorm(x,t.team); if(!e.teamId&&t.team) e.teamId=String(t.team.id); if(e.id){ m.set(e.id,e); n++; } }));
  if(n) INJIDX={}; return n;
}
function injMerge(a, b){ if(!a) return b; if(!b) return a; const [n,o]=Date.parse(b.date||0)>Date.parse(a.date||0)?[b,a]:[a,b];   // newer wins, older fills blanks (comments)
  const r=Object.assign({}, o, Object.fromEntries(Object.entries(n).filter(([,v])=>v!==''&&v!=null))); return r; }
function injIdx(lg){
  if(INJIDX[lg]) return INJIDX[lg];
  const byId=new Map(), list=[];
  ((INJ[lg]||{}).entries||[]).forEach(e=>{ if(e.id) byId.set(e.id, e); else list.push(e); });
  (INJSUM[lg]||new Map()).forEach((e,id)=>byId.set(id, injMerge(byId.get(id), e)));
  const all=[...byId.values(), ...list].filter(e=>injStatus(e.status));
  const byName=new Map(); all.forEach(e=>{ const k=normName(e.name); byName.set(k,[...(byName.get(k)||[]), e]); });
  return INJIDX[lg]={byId, byName, all};
}
const injList = lg=>injIdx(lg).all;
function injFind(lg, p){ // p: {id, name, teamId}. With an ESPN id, match by id only; without one, by name (+ team when known), unique only.
  if(!LG[lg]) return null; const I=injIdx(lg);
  if(p.id) { const e=I.byId.get(String(p.id)); return e&&injStatus(e.status)?e:null; }
  const c=(I.byName.get(normName(p.name))||[]).filter(e=>!p.teamId || e.teamId===String(p.teamId));
  return c.length===1 ? c[0] : null;
}
function injBadge(e, o={}){ const s=injStatus(e&&e.status); if(!s) return '';
  const tip=`${e.status}${e.type?' · '+e.type+(e.side?' ('+e.side+')':''):''}${e.date?' · ESPN update '+fmtDay(new Date(e.date)):''}${e.sc?'\n'+e.sc:''}`;
  return `<span class="ibadge ${s.cls}" data-injk="${s.k}" title="${esc(tip)}">${o.short?'🩹 '+esc(s.s):esc(s.lbl)}${o.type&&e.type?' · '+esc(e.type):''}</span>`; }
const injWhen = iso=>{ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?esc(iso):esc(fmtDay(d)+' '+fmtTime(d)); };
const injDay = iso=>{ if(!iso) return ''; const d=new Date(/^\d{4}-\d\d-\d\d$/.test(iso)?iso+'T12:00:00':iso); return isNaN(d)?'':fmtDay(d); };

// ---- "My players": fantasy roster, favorite players, players on My Teams (Purdue) ----
function myInjLeagues(){ const s=new Set(); if((DATA.fantasy.roster||[]).length) s.add('nfl'); (DATA.favoritePlayers||[]).forEach(p=>s.add(p.league)); LGS.forEach(lg=>{ if((DATA.myTeams[lg]||[]).length) s.add(lg); }); return [...s].filter(lg=>LG[lg]); }
function myInjuries(){
  const out=[], seen=new Set(), add=(lg,e,who,name)=>{ const k=lg+'|'+(e.id||e.name); if(seen.has(k)) { const x=out.find(o=>o.k===k); if(x && !x.who.includes(who)) x.who.push(who); return; } seen.add(k); out.push({k, lg, e, who:[who], name:name||e.name}); };
  (DATA.fantasy.roster||[]).filter(r=>!isDST(r)).forEach(r=>{ const e=injFind('nfl',{id:r.athleteId, name:r.name, teamId:r.teamId}); if(e) add('nfl', e, 'fantasy roster', r.name); });
  (DATA.favoritePlayers||[]).forEach(p=>{ const e=injFind(p.league,{id:p.id, name:p.name}); if(e) add(p.league, e, 'favorite player', p.name); });
  LGS.forEach(lg=>(DATA.myTeams[lg]||[]).forEach(t=>injList(lg).filter(e=>e.teamId===String(t.id)).forEach(e=>add(lg, e, (t.abbr||t.name)+' ('+LG[lg].short+')'))));
  return out.sort((a,b)=>injRank(a.e)-injRank(b.e) || a.name.localeCompare(b.name));
}
function injCoverageNote(lgs){ // honest notes for leagues where ESPN has nothing to check against
  return lgs.map(lg=>{ const c=INJ[lg]; if(!c || !c.at) return c&&c.err?`${LG[lg].short}: couldn't reach ESPN (${esc(c.err)})`:`${LG[lg].short}: not loaded yet`;
    if(!c.entries.length && LG[lg].college) return `${LG[lg].short}: ESPN has no current injury data${c.stale?` (only ${c.stale} item${c.stale>1?'s':''} over a year old)`:''}`; return ''; }).filter(Boolean);
}
function myInjBanner(){
  const lgs=myInjLeagues(); if(!lgs.length) return '';
  const L=myInjuries(), loaded=lgs.filter(lg=>INJ[lg]&&INJ[lg].at), at=loaded.map(lg=>INJ[lg].at).sort()[0];
  const notes=injCoverageNote(lgs), stamp=at?`<span class="note">ESPN injury reports · updated ${injWhen(at)}${notes.length?' · '+notes.join(' · '):''}</span>`:'';
  if(!loaded.length) return `<div class="injbar" id="myinj">🩹 Checking ESPN injury reports for your players… ${notes.length?`<span class="note">${notes.join(' · ')}</span>`:''}</div>`;
  if(!L.length) return `<div class="injbar ok" id="myinj">✅ No injury status on ESPN for your fantasy roster, favorite players or My Teams players. ${stamp}</div>`;
  const by=INJ_ST.concat([{k:'other',lbl:'other'}]).map(s=>[s, L.filter(x=>(injStatus(x.e.status)||{}).k===s.k).length]).filter(x=>x[1]);
  const fan=L.filter(x=>x.who.includes('fantasy roster')).length;
  const head=by.map(([s,n])=>`${n} ${s.k==='ir'?'on IR':s.lbl.toLowerCase()}`).join(' · ');
  return `<div class="injbar warn" id="myinj" data-injn="${L.length}">⚠️ <b>${L.length} of your player${L.length>1?'s':''} on ESPN's injury report</b>${fan?` (${fan} on your fantasy roster)`:''}: ${esc(head)}
    <span class="chips">${L.map(x=>`<span class="chip" data-injgo="${esc(x.name)}" title="${esc(x.who.join(', ')+(x.e.sc?' — '+x.e.sc:''))}">${esc(x.name)} ${injBadge(x.e,{short:true})}<span class="note">${esc(x.who.join(', '))}</span></span>`).join('')}</span> ${stamp}</div>`;
}

// ---- game detail: per-team injuries (summary + league report) ----

function gdPlays(d, lg){ // -> groups [{key, title, sub, score, plays:[{text,clock,period,scoring,away,home,type}]}] newest first
  const P = p=>({ id:String(p.id||''), text:p.text||p.shortDescription||(p.type&&p.type.text)||'', clock:(p.clock&&p.clock.displayValue)||'', period:(p.period&&p.period.number)||0,

    const dr=d.drives||{}, list=(dr.previous||[]).slice(); const seen=new Set(list.map(x=>String(x.id)));
    if(dr.current && !seen.has(String(dr.current.id))) list.push(Object.assign({current:true}, dr.current));
    else if(dr.current) list.forEach(x=>{ if(String(x.id)===String(dr.current.id)) x.current=true; });
    return list.map((x,i)=>({ key:'d'+(x.id||i), title:`${(x.team&&x.team.abbreviation)||''} drive${x.current?' · in progress':''}`, logo:x.team&&x.team.logos&&x.team.logos[0]&&x.team.logos[0].href,

      result:x.current?'':(x.displayResult||x.result||''), isScore:!!x.isScore, plays:(x.plays||[]).map(P).reverse() })).reverse();
  }

}
function gdSituation(d, lg, g, groups){
  const ev=EVSTORE.get(String(g.id)), sb=(ev&&ev.sit)||null, s=d.situation||null;
  const all = groups.flatMap(x=>x.plays), newest = all[0] || null, withDD = all.find(p=>p.end&&p.end.downDistanceText) || null;
  if(g.state!=='in') return null;
  // summary data first (it matches the play list shown below); the scoreboard snapshot is only a fallback
  const scored = !!(newest && newest.scoring);   // after a score the next snap hasn't happened yet
  const dd = (s&&s.downDistanceText) || (scored?'':(isFootball(lg)&&withDD&&withDD.end.downDistanceText)) || (!newest&&sb&&sb.dd) || '';
  const possId = (s&&s.possession&&String(s.possession)) || (isFootball(lg)&&!scored&&withDD&&withDD.end.team&&String(withDD.end.team.id)) || (!newest&&sb&&sb.poss) || '';
  const poss = possId ? [g.home,g.away].find(t=>t.id===possId) : null;
  const last = (s&&s.lastPlay&&s.lastPlay.text) || (newest&&newest.text) || (sb&&sb.last) || '';
  const rz = !!((s&&s.isRedZone) || (dd && withDD && withDD.end && withDD.end.yardsToEndzone!=null && withDD.end.yardsToEndzone<=20));

}

// ---------------- FIELD POSITION (football only: CFB + NFL) ----------------
// Orientation (fixed, independent of which way teams really face each quarter): AWAY end zone on the LEFT,
// HOME end zone on the RIGHT. x = yards from the away goal line (0 = away goal, 100 = home goal).
// The away team drives right (toward x=100), the home team drives left (toward x=0).
// ESPN fields, checked against real summaries (Florida at Texas, Ohio State at Indiana, Northwestern at Michigan State
// CFB 2026-10-17, and HOU vs JAX NFL live 2026-10-18; 907 start/end records):
//  • yardLine (play start/end and scoreboard situation) is measured from the HOME goal line: HOU (away) at "HOU 6" has
//    yardLine 94, JAX (home) at "JAX 21" has yardLine 21. So x = 100 − yardLine. This matched possessionText on 907/907.
//  • possessionText "HOU 27" = 27 yards from HOU's goal line → x = 27 if HOU is away, 73 if home; "50" → 50.
//  • yardsToEndzone = yards the possessing team needs to score → x = 100 − ytez (away) or ytez (home). It agreed on
//    only ~98%: it is 0 on timeouts and wrong on some punts / kneels. So it is only the last fallback here.
//  Yards to the goal the offense attacks: away → 100 − x, home → x. Red zone = ≤ 20 of those.
function fpSpot(rec, g){ // rec = summary situation, a play's start/end, or the scoreboard situation → spot or null
  if(!rec) return null;
  const poss = String((rec.team&&rec.team.id) || rec.possession || rec.poss || '');
  const dir = poss===g.away.id ? 1 : poss===g.home.id ? -1 : 0;
  const pt = String(rec.possessionText || (String(rec.downDistanceText||rec.dd||'').split(' at ')[1]) || '').trim();
  let x = null; const m = /^(.+?)\s+(\d{1,2})$/.exec(pt);

// ---------------- MANUAL GAMES (not on ESPN's scoreboard) ----------------
const MANUAL_SOON = 15*60*1000, MANUAL_LEN = 2.5*60*60*1000;
function manualDateKey(start){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(start||'')); return m?m[1]+m[2]+m[3]:''; }
function manualPhase(m, now){
  now = now || new Date();
  const start = new Date(m.start), t = +now - +start;
  if(isNaN(t)) return {state:'pre', text:'Time TBD'};
  if(t < -MANUAL_SOON){ const ms=-t, h=Math.floor(ms/3600000), min=Math.floor((ms%3600000)/60000); return {state:'pre', text:h?`Tips in ${h}h ${min}m`:`Tips in ${min}m`}; }
  if(t < 0) return {state:'pre', text:'Starting soon'};
  if(t < MANUAL_LEN) return {state:'in', text:'In progress, see live box score'};
  return {state:'post', text:'Final, see box score'};
}
function manualOnSlate(m, lg, vs){
  if(!m || m.lg!==lg) return false;
  const start=new Date(m.start); if(isNaN(+start)) return false;
  const L=LG[lg]; if(!L) return false;
  if(L.mode!=='week') return manualDateKey(m.start)===vs.date;
  const w=(vs.weeks||[])[vs.idx]; return !!(w && start>=w.start && start<w.end);
}
const teamKey = s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function manualSideHit(side, espn){
  if(!side || !espn) return false;
  if(side.espnId!=null && side.espnId!=='' && espn.id && String(side.espnId)===String(espn.id)) return true;
  const name=teamKey(side.name);
  if(name && [teamKey(espn.name), teamKey(espn.full)].includes(name)) return true;
  const short=teamKey(side.short);
  return !!(short && teamKey(espn.abbr)===short);
}
const espnHasManual = (games,m)=>games.some(g=>(manualSideHit(m.away,g.away)&&manualSideHit(m.home,g.home))||(manualSideHit(m.away,g.home)&&manualSideHit(m.home,g.away)));
function manualLogo(side, lg){
  if(!side || side.espnId==null || side.espnId==='') return '';
  return LG[lg]&&LG[lg].college ? `https://a.espncdn.com/i/teamlogos/ncaa/500/${side.espnId}.png` : '';
}
function manualFavIds(m){
  const ids=new Set();
  [m.away,m.home].forEach(s=>{ const id=s&&s.espnId!=null?String(s.espnId):''; if(!id) return;
    if(LGS.some(l=>(DATA.myTeams[l]||[]).some(t=>String(t.id)===id))) ids.add(id); });
  return ids;
}
function manualAsGame(m){
  const ph=manualPhase(m), id=s=>s&&s.espnId!=null?String(s.espnId):'';
  return {state:ph.state, lg:m.lg, date:new Date(m.start), sit:null, home:{id:id(m.home), rank:null, score:null}, away:{id:id(m.away), rank:null, score:null}};
}
function manualCardHTML(m){
  const lg=m.lg, start=new Date(m.start), ph=manualPhase(m), favSet=manualFavIds(m);
  const side=s=>({id:s&&s.espnId!=null?String(s.espnId):'', abbr:s.short||'', name:s.name||'', logo:manualLogo(s,lg), score:null, rank:null, record:''});
  const g={lg, state:ph.state, home:side(m.home), away:side(m.away)};
  const links=(m.links||[]).filter(l=>l&&l.url).map(l=>`<a class="btn sm pri" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label||'Box score')}</a>`).join('');
  return `<div class="g manual${ph.state==='in'?' live':''}${favSet.size?' fav':''}" data-manual="${esc(m.id)}">
    <div class="lgtag"><span>${esc(m.label||'Exhibition')}</span><span>${esc(fmtTime(start))}</span></div>
    ${teamRow(g,g.away,favSet)}${teamRow(g,g.home,favSet)}
    ${m.venue?`<div class="sit">${esc(m.venue)}</div>`:''}
    <div class="tags"><span class="badge b-n">${esc(m.label||'Exhibition')}</span></div>

function flattenWeeks(cal){
  const out=[];
  (cal||[]).forEach(grp=>{ if(!grp||typeof grp!=='object'||/off ?season/i.test(grp.label||'')) return;
    (grp.entries||[]).forEach(en=>out.push({st:String(grp.value), week:String(en.value), label:en.label, alt:en.alternateLabel, detail:en.detail||'', group:grp.label, start:new Date(en.startDate), end:new Date(en.endDate)})); });
  return out;
}
function scoreboardURL(lg){
  const L=LG[lg], vs=VS[lg]; const q=[]; if(L.sb) q.push(L.sb);
  if(L.mode==='week'){ if(vs.nav) q.push(`seasontype=${vs.nav.st}`,`week=${vs.nav.week}`,`dates=${vs.nav.year}`); }

}

async function navLeague(lg, act, val){

      else if(act==='date'){ const dt=new Date(val+'T12:00:00'); i=ws.findIndex(w=>dt>=w.start&&dt<w.end); if(i<0) i = dt<ws[0].start?0:(ws.findIndex(w=>w.start>dt)>=0?ws.findIndex(w=>w.start>dt):ws.length-1); }

    else if(act==='jump') vs.date=val;

  }

}

// ---------------- BETTING MATH ----------------
const decOdds = a=>{ a=+a; return a>0 ? 1+a/100 : 1+100/Math.abs(a); };
const validOdds = a=>Number.isFinite(+a) && Math.abs(+a)>=100;
const fmtOdds = a=>a==null||a===''?'—':(+a>0?'+':'')+(+a);
const MARKETS = {moneyline:'Moneyline', spread:'Spread', total:'Total', prop:'Prop'}; // player_* and other FanDuel names become prop in parseLegs
const BETTYPES = {moneyline:'Moneyline', spread:'Spread', total:'Total', parlay:'Parlay', prop:'Prop'};
const VERDICTS = ['Consider','Wait','Pass'];
const LEGEV = new Map(); // eventId -> normalized event fetched for grading

function legEvent(leg){ if(leg.final) return snapToEvent(leg); return LEGEV.get(leg.eventId) || EVSTORE.get(leg.eventId) || null; }
function selName(leg){ if(leg.market==='total') return (leg.selection==='under'?'Under':'Over')+(leg.line!=null?' '+leg.line:''); if(leg.market==='prop') return leg.selection||leg.selectionName||'Prop'; return (leg.selectionName||leg.selection)+(leg.market==='spread'&&leg.line!=null?' '+(leg.line>0?'+':'')+leg.line:'')+(leg.market==='moneyline'?' ML':''); }
// Grade one leg. res: won|lost|push|pending|live|manual
function gradeLeg(leg){
  if(leg.manual) return {res:leg.manual, badge:'MANUAL: '+leg.manual.toUpperCase(), cls:leg.manual==='won'?'b-g':leg.manual==='lost'?'b-r':'b-n'};
  if(leg.market==='prop' || !leg.eventId) return {res:'manual', badge:'SET RESULT', cls:'b-a', note:'Props are graded manually.'};
  const g = legEvent(leg); if(!g) return {res:'pending', badge:'LOADING', cls:'b-n'};
  if(g.state==='pre' || g.home.score==null) return {res:'pending', badge:'PENDING', cls:'b-n', g};
  const home=g.home, away=g.away;
  let metric, note='';
  if(leg.market==='total'){
    const tot = home.score+away.score, line=+leg.line;
    metric = leg.selection==='under' ? line-tot : tot-line;
    note = `Total ${tot} vs ${line} (${leg.selection==='under'?'under':'over'})`;
  } else {
    const p = home.id===String(leg.selection)?home:away.id===String(leg.selection)?away:null;
    if(!p) return {res:'pending', badge:'CHECK TEAM', cls:'b-a', g, note:'Selected team not found in this game.'};
    const o = p===home?away:home, diff=p.score-o.score;
    metric = leg.market==='spread' ? diff + (+leg.line||0) : diff;
    note = leg.market==='spread' ? `Margin: ${p.abbr} ${diff>=0?'+':''}${diff} with ${leg.line>0?'+':''}${leg.line} → ${metric>0?'covering':metric<0?'not covering':'push'}` : `${p.abbr} ${diff>=0?'+':''}${diff}`;
  }
  if(g.state==='post') return metric>0?{res:'won',badge:'FINAL WON ✓',cls:'b-g',g,note}:metric<0?{res:'lost',badge:'FINAL LOST ✗',cls:'b-r',g,note}:{res:'push',badge:'FINAL PUSH',cls:'b-n',g,note};
  const word = leg.market==='spread'?(metric>0?'COVERING':metric<0?'NOT COVERING':'ON THE NUMBER'):leg.market==='total'?(metric>0?(leg.selection==='under'?'UNDER PACE ✓':'OVER HIT ✓'):metric<0?(leg.selection==='under'?'OVER THE LINE':'NEEDS '+(-metric)+' MORE'):'ON THE NUMBER'):(metric>0?'WINNING':metric<0?'LOSING':'TIED');
  // a live under is never "safe" — flag as ok only while under the number
  return {res:'live', live:metric>0?'ok':metric<0?'bad':'tie', badge:word, cls:metric>0?'b-g':metric<0?'b-r':'b-a', g, note};
}
// Grade a whole slip. Returns status, payout (total returned), pl.
function gradeBet(b){
  const lr = (b.legs||[]).map(gradeLeg);
  const stake = +b.stake||0;
  let status, payout=null, txt, cls, pushAdj=false;
  if(b.resultOverride){
    status=b.resultOverride;
    payout = b.payoutOverride!=null ? +b.payoutOverride : status==='won'?stake*decOdds(b.odds):status==='lost'?0:stake;
    txt = {won:'CASHED ✓',lost:'LOST ✗',push:'PUSH',void:'VOID',cashout:'CASHED OUT'}[status]+' (manual)'; cls=status==='won'||(status==='cashout'&&payout>stake)?'b-g':status==='lost'?'b-r':'b-n';
  } else {
    const r = lr.map(x=>x.res);
    if(!r.length){ status='open'; txt='NO LEGS'; cls='b-n'; }
    else if(r.includes('lost')){ status='lost'; payout=0; txt='TICKET LOST ✗'; cls='b-r'; }
    else if(r.every(x=>x==='won'||x==='push')){
      if(r.every(x=>x==='push')){ status='push'; payout=stake; txt='PUSH (stake back)'; cls='b-n'; }
      else { status='won';
        if(r.includes('push')){ pushAdj=true;
          const live = b.legs.filter((l,i)=>r[i]==='won');
          payout = live.every(l=>validOdds(l.odds)) ? stake*live.reduce((m,l)=>m*decOdds(l.odds),1) : stake*decOdds(b.odds);
        } else payout = stake*decOdds(b.odds);
        txt='TICKET CASHED ✓ '+money(payout); cls='b-g'; }
    }
    else { status='open';
      const nLive=r.filter(x=>x==='live').length, bad=lr.some(x=>x.live==='bad'||x.live==='tie'), good=r.filter(x=>x==='won'||(x==='live')).length;
      if(r.includes('manual')){ txt='NEEDS MANUAL RESULT'; cls='b-a'; }
      else if(r.every(x=>x==='pending')){ txt='PENDING'; cls='b-n'; }
      else if(bad){ txt='IN DANGER'; cls='b-r'; }
      else if(lr.every(x=>x.res==='won'||x.res==='push'||x.live==='ok')){ txt='ON TRACK ⚡'; cls='b-g'; }
      else { txt=`ALIVE · ${lr.filter(x=>x.res==='won'||x.live==='ok').length}/${r.length} good`; cls='b-gold'; }
      void nLive; void good;
    }
  }
  const pl = payout==null ? null : payout-stake;
  return {status, payout, pl, txt, cls, lr, pushAdj};
}
function clv(b){ if(!validOdds(b.closingOdds)||!validOdds(b.odds)) return null; return (decOdds(b.odds)/decOdds(b.closingOdds)-1)*100; }
function aggregate(bets){
  const a={n:0,w:0,l:0,p:0,open:0,staked:0,settledStake:0,pl:0,clvSum:0,clvN:0};
  bets.forEach(b=>{ const g=gradeBet(b); a.n++; a.staked+=+b.stake||0;
    if(g.status==='open'){a.open++;} else { a.settledStake+=+b.stake||0; a.pl+=g.pl||0; if(g.status==='won'||(g.status==='cashout'&&g.pl>0))a.w++; else if(g.status==='lost'||(g.status==='cashout'&&g.pl<0))a.l++; else a.p++; }
    const c=clv(b); if(c!=null){a.clvSum+=c;a.clvN++;} });
  a.roi = a.settledStake? a.pl/a.settledStake*100 : 0; a.clv = a.clvN? a.clvSum/a.clvN : null; return a;
}
const units = n=>{ const u=+DATA.settings.unitSize; return u>0 ? ` <span class="note">(${(n/u>0&&n!==0?'+':'')}${(n/u).toFixed(2)}u)</span>` : ''; };

// ---------------- ANALYSTS (who made a pick: Blitz = football, Court = basketball) ----------------
// ONE rule for the whole hub (cards, modal, Bets, Pick records):
//   1. the optional `analyst` column (case-insensitive: "court", "COURT " → Court; an unknown name is shown as written, capitalized)
//   2. else the id prefix: blitz-… → Blitz, court-… → Court
//   3. else the legs' sport: all basketball → Court, football or mixed → Blitz
const ANALYSTS = { blitz:{name:'Blitz', sport:'football', color:'var(--gold2)', icon:'⚡'}, court:{name:'Court', sport:'basketball', color:'var(--court)', icon:'🏀'} };
function analystOf(b){
  const col=sStr(b&&b.analyst);
  if(col){ const k=col.toLowerCase(); return ANALYSTS[k] ? ANALYSTS[k].name : col.charAt(0).toUpperCase()+col.slice(1); }
  const m=/^([a-z]+)-/i.exec(String((b&&b.id)||'')); if(m && ANALYSTS[m[1].toLowerCase()]) return ANALYSTS[m[1].toLowerCase()].name;
  const sp=new Set(((b&&b.legs)||[]).map(l=>(LG[l.league]||{}).sport).filter(Boolean));
  return sp.size===1 && sp.has('basketball') ? ANALYSTS.court.name : ANALYSTS.blitz.name;
}
const anKey = n=>String(n||'').toLowerCase();
const analystsIn = list=>[...new Set(list.map(analystOf))];
const anList = list=>{ const seen=analystsIn(list); return [...Object.values(ANALYSTS).map(a=>a.name), ...seen.filter(n=>!ANALYSTS[anKey(n)]).sort()]; };   // known first, then any others found
function analystTag(name){ const a=ANALYSTS[anKey(name)]; return `<span class="antag" data-analyst="${esc(name)}"${a?` style="border-color:${a.color};color:${a.color}"`:''}>${a?a.icon+' ':''}${esc(name)}</span>`; }
const isTestId = id=>/(^|-)test(-|$)/i.test(String(id||''));   // TEST-… or court-TEST-… fixture rows
const whoHas = list=>{ const n=analystsIn(list); return 'Picks Desk ('+n.join(' & ')+') has'; };

// ---------------- ANALYST PICKS PER GAME (score-card chip + game detail section) ----------------
// A recommendation / bet belongs to a game when any of its legs has that ESPN eventId (compared as strings).
const evMatch = (l,id)=>!!l && l.eventId!=null && l.eventId!=='' && String(l.eventId)===String(id);
const betsForEvent = (arr,id)=>(arr||[]).filter(b=>(b.legs||[]).some(l=>evMatch(l,id)));
const VCLS = {Consider:'b-g', Wait:'b-a', Pass:'b-n'};
function pickChip(id, lg){
  const recs = betsForEvent(DATA&&DATA.recommendations, id); if(!recs.length) return '';
  const by = VERDICTS.map(v=>[v, recs.filter(r=>r.verdict===v).length]).filter(x=>x[1]).map(x=>x[1]+' '+x[0]).join(', ');
  return `<button type="button" class="badge b-b pickchip" data-gd="${esc(id)}" data-lg="${esc(lg)}" title="${esc(whoHas(recs))} ${recs.length} pick${recs.length>1?'s':''} on this game (${esc(by)}${analystsIn(recs).length>1?' · '+esc(analystsIn(recs).map(n=>n+' '+recs.filter(r=>analystOf(r)===n).length).join(', ')):''}). Click for details.">🎯 ${recs.length}</button>`;
}
function refreshPickChips(){ // patch chips in place after a sheet sync (no re-render, so drag order / scroll are untouched)
  document.querySelectorAll('.g[data-ev][data-lg]').forEach(card=>{
    if(card.dataset.nopicks) return;
    const html = pickChip(card.dataset.ev, card.dataset.lg), old = card.querySelector(':scope > .tags > .pickchip');
    if(old){ if(html) old.outerHTML = html; else old.remove(); return; }
    if(!html) return;
    let tags = card.querySelector(':scope > .tags');
    if(!tags){ const foot=card.querySelector(':scope > .foot'); if(!foot) return; foot.insertAdjacentHTML('beforebegin','<div class="tags"></div>'); tags=card.querySelector(':scope > .tags'); }
    tags.insertAdjacentHTML('afterbegin', html);
  });
}
function legLabel(l, g){ // selName(), but fills a team name from the game when the sheet row only has the ESPN team id
  let nm = l.selectionName;
  if(!nm && g && (l.market==='moneyline'||l.market==='spread')){ const t=[g.home,g.away].find(x=>x && x.id===String(l.selection)); if(t) nm=t.name; }
  return selName(nm ? Object.assign({}, l, {selectionName:nm}) : l);
}
function legBadge(l){ // existing gradeLeg(); props stay manual
  const r = gradeLeg(l);
  if(r.res==='manual') return `<span class="badge b-n" title="${esc(r.note||'')}">PROP · GRADE MANUALLY</span>`;
  if(r.badge==='LOADING') return '';
  return `<span class="badge ${r.cls}" title="${esc(r.note||'')}">${esc(r.badge)}</span>`;
}
const legMarket = l=>esc(MARKETS[l.market]||l.market)+(l.market==='prop'&&l.line!=null?' · line '+esc(l.line):'')+(l.odds!=null&&l.odds!==''?' · '+fmtOdds(l.odds):'');
function gdPickCard(b, id, g, mine){
  const legs = b.legs||[], hit = legs.filter(l=>evMatch(l,id)), rest = legs.filter(l=>!evMatch(l,id));
  const boosted = b.boosted || /boost/i.test(b.oddsNote||'');
  const gr = legs.length>1 ? gradeBet(b) : null;
  const head = mine
    ? `<span class="badge b-gold">YOUR BET</span>${b.demo?' <span class="demo-ribbon">DEMO</span>':''}`
    : `${analystTag(analystOf(b))} <span class="badge ${VCLS[b.verdict]||'b-n'}">${esc((b.verdict||'Consider').toUpperCase())}</span>`;
  return `<div class="pick ${mine?'mybet':'v-'+esc(String(b.verdict||'consider').toLowerCase())}" data-pick="${esc(b.id)}">
    <div class="pktop">${head}<b>${esc(BETTYPES[b.betType]||b.betType)}</b>${legs.length>1?` <span class="badge b-n">Parlay leg (${legs.length} legs, ${fmtOdds(b.odds)})</span>`:''}${gr?` <span class="badge ${gr.cls}" title="Whole ticket">${esc(!mine&&gr.status==='won'?'TICKET WON ✓':(/^TICKET/.test(gr.txt)?'':'TICKET · ')+gr.txt)}</span>`:''}<span class="note">${esc(b.date||'')}${b.source==='sheet'?' · 📄 sheet':' · hub only'}</span></div>
    ${hit.map(l=>`<div class="pkleg"><b>${esc(legLabel(l,g))}</b><span class="note">${legMarket(l)}</span>${legBadge(l)}</div>${propInjury(l)}`).join('')}
    ${rest.length?`<ul class="pkother">${rest.map(l=>{ const og=legEvent(l); return `<li>${esc(legLabel(l,og))} <span>· ${legMarket(l)}${l.game?' · '+esc(l.game):''}</span> ${legBadge(l)}${propInjury(l)}</li>`; }).join('')}</ul>`:''}
    <div class="pkmeta">Odds <b>${fmtOdds(b.odds)}</b>${boosted?' <span class="badge b-gold">🚀 BOOSTED</span>':''} · ${esc(b.book||'—')}${mine&&b.stake!=null?` · Stake <b>${money(+b.stake)}</b>`:''}${b.oddsNote?` <span title="${esc(b.oddsNote)}">· ${esc(b.oddsNote.length>70?b.oddsNote.slice(0,70)+'…':b.oddsNote)}</span>`:''}</div>
    ${b.notes?`<div class="pknotes">${esc(b.notes)}</div>`:''}
  </div>`;
}
async function gdLoadPickLegs(id){ // other legs of parlays on this game: fetch their games once so they get names + grades
  const legs = [...betsForEvent(DATA.recommendations,id), ...betsForEvent(DATA.placedBets,id)].flatMap(b=>b.legs||[])

}
function gdPicksHTML(g){

// ---------------- DRAFT FORM STATE ----------------
let DRAFT = null;
function newDraft(kind='placed'){ return {editingId:null, kind, betType:'moneyline', book:DATA.settings.defaultBook||'FanDuel', date:isoDay(new Date()), stake:'', odds:'', oddsNote:'', oddsVerified:false, verdict:'Consider', notes:'', legs:[blankLeg()], origOdds:null, origEnteredAt:null, origVerifiedAt:null}; }
function blankLeg(lg){ return {league:lg||pref.get('lastLeague','cfb'), date:isoDay(new Date()), eventId:'', game:'', teams:[], market:'moneyline', selection:'', selectionName:'', line:'', odds:''}; }
function addGameToSlip(evId, lg){
  const g = EVSTORE.get(evId); if(!g) return;
  if(!DRAFT) DRAFT=newDraft();

function saveDraft(){

  const rec=D.kind==='rec', stake=parseFloat(D.stake), odds=parseInt(String(D.odds).replace('+',''),10);
  if(!rec && !(stake>0)) return msg('Enter a stake.');

  if(D.betType==='parlay' && D.legs.length<2) return msg('A parlay needs at least 2 legs.');
  for(const [i,l] of D.legs.entries()){

}

// ---------------- BLITZ RECORD (prediction accuracy; read-only, never writes the sheet) ----------------
// Picks = DATA.recommendations (Google Sheet "Recommendations" tab via syncSheet(), plus the cached copy and hub-only recs).
// Grade: result_override (won/lost/push) if Blitz filled it, else the hub's gradeBet() auto-grade of finished ML/spread/total/parlay legs.
// Props without an override and unfinished games are pending. void/cashout overrides are excluded. Flat $5 per pick at the logged odds.
const BR_STAKE = 5;
const BRR = { range:{'7d':'Last 7 days','30d':'Last 30 days','season':'Season (since Aug 1)','all':'All'} };
function recGrade(b){ // -> 'won'|'lost'|'push'|'pending'|'void', src
  const o=b.resultOverride; if(o) return {res:['won','lost','push'].includes(o)?o:'void', src:'override'};

function recDay(b){ // game day of the pick (latest leg's game, local), falling back to the row's date column
  const ds=(b.legs||[]).map(l=>{ if(l.date) return String(l.date).slice(0,10); const g=LEGEV.get(String(l.eventId))||EVSTORE.get(String(l.eventId)); return g&&g.date&&!isNaN(g.date) ? isoDay(g.date) : ''; }).filter(x=>/^\d{4}-\d\d-\d\d$/.test(x)).sort();

const recLeagues = b=>[...new Set((b.legs||[]).map(l=>l.league))];

const CONF_LV = ['Low','Low-Med','Medium','Med-High','High'];
function recConfidence(b){ // -> {lv, src:'column'|'notes'} or null
  const map=t=>{ t=String(t||'').toLowerCase().trim(); if(!t) return null;
    let m=/^([1-5])(?:\s*\/\s*5)?$/.exec(t); if(m) return CONF_LV[+m[1]-1];
    if(/^(med(ium)?[- ]high|high[- ]med(ium)?)$/.test(t)) return 'Med-High'; if(/^(low[- ]med(ium)?|med(ium)?[- ]low)$/.test(t)) return 'Low-Med';
    if(/^high$/.test(t)) return 'High'; if(/^med(ium)?$/.test(t)) return 'Medium'; if(/^low$/.test(t)) return 'Low'; return null; };
  const c=map(b.confidence); if(c) return {lv:c, src:'column'};
  const n=String(b.notes||'');
  let m=/conf(?:idence)?\s*[:=]?\s*([1-5]\s*\/\s*5|[1-5]\b|(?:low|med(?:ium)?|high)(?:[- ](?:low|med(?:ium)?|high))?)/i.exec(n); if(m && map(m[1])) return {lv:map(m[1]), src:'notes'};
  m=/\b((?:low|med(?:ium)?|high)(?:[- ](?:low|med(?:ium)?|high))?)\s+conf(?:idence)?\b/i.exec(n); if(m && map(m[1])) return {lv:map(m[1]), src:'notes'};
  m=/(⭐{1,5})(?!⭐)/u.exec(n); if(m){ const k=[...m[1]].length; return {lv:CONF_LV[k-1], src:'notes'}; }

}
const amCents = a=>{ a=+a; return a>0 ? a-100 : a+100; };            // -110 → -10, +110 → +10, ±100 → 0
const implP = a=>1/decOdds(a);

const fmtPct0 = v=>v==null?'—':v.toFixed(1)+'%';
function brStats(list){ // list of {b, gr} (graded or pending)
  const g=list.filter(x=>['won','lost','push'].includes(x.gr.res));
  const a=aggregate(g.map(x=>Object.assign({}, x.b, {stake:BR_STAKE})));   // existing record / P/L / ROI / CLV math

function brPL(x){ return gradeBet(Object.assign({}, x.b, {stake:BR_STAKE})).pl; }
function svgChart(xs, series, o={}){ // xs: x labels; series: [{name, ys, color, dash}] ; o: {min,max,ref,fmt}
  const W=640,H=190,L=46,Rr=12,T=12,B=28, vals=series.flatMap(s=>s.ys).filter(v=>v!=null&&isFinite(v));
  if(!xs.length || !vals.length) return `<div class="brchart"><div class="note">${esc(o.title||'')}</div><div class="empty">No graded picks in this range yet.</div></div>`;
  let lo=o.min!=null?o.min:Math.min(...vals, o.ref??vals[0]), hi=o.max!=null?o.max:Math.max(...vals, o.ref??vals[0]); if(hi===lo){ hi+=1; lo-=1; }
  const pad=(hi-lo)*.08; if(o.min==null) lo-=pad; if(o.max==null) hi+=pad;
  const X=i=>L+(xs.length===1?(W-L-Rr)/2:i*(W-L-Rr)/(xs.length-1)), Y=v=>T+(hi-v)*(H-T-B)/(hi-lo), f=o.fmt||(v=>String(Math.round(v)));
  let g=''; for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4; g+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)"/><text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" fill="var(--mut)" font-size="11" text-anchor="end">${esc(f(v))}</text>`; }
  if(o.ref!=null && o.ref>lo && o.ref<hi) g+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(o.ref).toFixed(1)}" y2="${Y(o.ref).toFixed(1)}" stroke="var(--mut)" stroke-dasharray="4 4"/>`;
  const step=Math.max(1,Math.ceil(xs.length/8)); xs.forEach((x,i)=>{ if(i%step===0||i===xs.length-1) g+=`<text x="${X(i).toFixed(1)}" y="${H-8}" fill="var(--mut)" font-size="11" text-anchor="middle">${esc(x.slice(5))}</text>`; });
  series.forEach(s=>{ const pts=s.ys.map((v,i)=>v==null||!isFinite(v)?null:[X(i),Y(v),v,xs[i]]).filter(Boolean); if(!pts.length) return;
    g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" ${s.dash?'stroke-dasharray="6 4"':''} points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
    g+=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${s.color}"><title>${esc(s.name)} · ${esc(p[3])}: ${esc(f(p[2]))}</title></circle>`).join(''); });

}

async function syncSheet(force, maxAge=20000){

// ---------------- TEAM ROSTER ----------------
// ESPN roster (CORS open from http(s), checked in Chrome): site.api.espn.com/apis/site/v2/sports/{sport}/{league}/teams/{id}/roster
// Headshots are the href ESPN returns (a.espncdn.com). /teams?enable=injuries is CORS-blocked and is not used.
// Each roster is cached in memory for this page session. Photos use loading="lazy".
const ROSTER_CACHE = new Map();
const ROSTER_GROUP = {offense:'Offense', defense:'Defense', specialTeam:'Special teams', specialTeams:'Special teams', injuredReserveOrOut:'Injured reserve / Out', suspended:'Suspended', practiceSquad:'Practice squad'};
let RST = null, RSTN = 0;
function rosterBtn(lg, id){ return `<button type="button" class="rbtn" data-roster="${esc(lg)}|${esc(id)}">Roster</button>`; }
function rosterURL(lg, id){ return API+LG[lg].path+'/teams/'+encodeURIComponent(id)+'/roster'; }
function rosterInitials(name){ const p=String(name||'').trim().split(/\s+/).filter(Boolean); if(!p.length) return '?'; if(p.length===1) return p[0].slice(0,2).toUpperCase(); return (p[0][0]+p[p.length-1][0]).toUpperCase(); }
function rosterYear(p, college){
  const exp=p.experience||{};
  if(college) return exp.displayValue||exp.abbreviation||'';
  if(p.age!=null && p.age!=='') return 'Age '+p.age;
  if(exp.years!=null && exp.years!=='') return exp.years+' yr'+(exp.years==1?'':'s');
  return '';
}
function normRosterPlayer(p, group){
  const pos=p.position||{}, col=p.college||{};
  return { id:String(p.id||''), name:p.displayName||p.fullName||'', jersey:p.jersey!=null&&p.jersey!==''?String(p.jersey):'',
    pos:pos.abbreviation||'', posName:pos.displayName||pos.name||'', group:group||'',
    height:p.displayHeight||'', weight:p.displayWeight||'', year:'', college:col.shortName||col.name||'',
    headshot:(p.headshot&&p.headshot.href)||'' , _age:p.age, _exp:p.experience||null };
}
function rosterNorm(d, lg){
  const team=d.team||{}, logos=team.logos||[];
  const logo=(logos.find(l=>(l.rel||[]).includes('default'))||logos[0]||{}).href || team.logo || (LG[lg].college&&team.id?`https://a.espncdn.com/i/teamlogos/ncaa/500/${team.id}.png`:'');
  const ath=d.athletes||[];
  let groups=[];
  if(ath.length && Array.isArray(ath[0].items)){
    ath.forEach(g=>{ const key=String(g.position||'other'); const items=(g.items||[]).map(p=>normRosterPlayer(p, key)).filter(p=>p.name);
      items.forEach(p=>{ p.year=rosterYear({age:p._age, experience:p._exp}, LG[lg].college); if(LG[lg].college) p.college=''; });
      if(items.length) groups.push({key, label:ROSTER_GROUP[key]||key, items}); });
  } else {
    const items=ath.map(p=>normRosterPlayer(p,'')).filter(p=>p.name);
    items.forEach(p=>{ p.year=rosterYear({age:p._age, experience:p._exp}, LG[lg].college); if(LG[lg].college) p.college=''; });
    if(items.length) groups=[{key:'all', label:'', items}];
  }
  const n=groups.reduce((a,g)=>a+g.items.length,0);
  return { team:{id:String(team.id||''), name:team.displayName||team.shortDisplayName||team.name||'Team', abbr:team.abbreviation||'', logo},
    season:(d.season&&(d.season.displayName||d.season.year))||'', groups, n };
}
function rosterLoad(lg, id){
  const k=lg+'|'+id;
  if(ROSTER_CACHE.has(k)) return ROSTER_CACHE.get(k);
  const p=getJSON(rosterURL(lg,id), -1).then(d=>rosterNorm(d,lg)).catch(e=>{ ROSTER_CACHE.delete(k); throw e; });
  ROSTER_CACHE.set(k, p); return p;
}
function rosterHit(p, q){
  if(!q) return true;
  return [p.name, p.jersey, p.pos, p.posName, p.college, p.year, p.height, p.weight].join(' ').toLowerCase().includes(q);
}
function rosterCard(p, lg, teamId){
  const inj=injBadge(injFind(lg,{id:p.id, name:p.name, teamId}));
  const who=[p.jersey?('#'+p.jersey):'', p.pos].filter(Boolean).join(' · ');
  const facts=[p.height, p.weight, p.year, p.college].filter(Boolean).join(' · ');
  const photo=p.headshot?`<img src="${esc(p.headshot)}" alt="" loading="lazy" onerror="this.remove()">`:'';
  return `<article class="rcard" data-rid="${esc(p.id)}"><div class="rphoto"><span class="ph" aria-hidden="true">${esc(rosterInitials(p.name))}</span>${photo}</div>
    <div class="pn">${esc(p.name)}</div>
    <div class="meta">${esc(who||'—')}${inj?' '+inj:''}</div>
    ${facts?`<div class="meta">${esc(facts)}</div>`:''}</article>`;
}
function paintRoster(q){
  if(!RST||!RST.data) return;
  const {lg, data}=RST, query=String(q==null?($('#rosterq')&&$('#rosterq').value)||'':q).trim().toLowerCase();
  const shown=data.groups.map(g=>({...g, items:g.items.filter(p=>rosterHit(p, query))})).filter(g=>g.items.length);
  const n=shown.reduce((a,g)=>a+g.items.length,0);
  const list=shown.length?shown.map(g=>`<section class="rgroup">${g.label?`<h3 class="gdh">${esc(g.label)} <span class="note">${g.items.length}</span></h3>`:''}<div class="rgrid">${g.items.map(p=>rosterCard(p, lg, data.team.id)).join('')}</div></section>`).join('')
    : `<div class="empty">No players match${query?' “'+esc(query)+'”':''}.</div>`;
  const count=`${esc(LG[lg].short)}${data.season?' · '+esc(String(data.season)):''} · ${n} player${n===1?'':'s'}${query&&n!==data.n?' of '+data.n:''}`;
  if(!$('#rosterq')){
    $('#rosterbody').innerHTML=`<div class="rhead">${data.team.logo?`<img src="${esc(data.team.logo)}" alt="">`:''}<div><div class="rtitle">${esc(data.team.name)}</div><div class="note" id="rostercount">${count}</div></div></div>
      <input id="rosterq" type="search" placeholder="Search name, number, position…" aria-label="Filter roster" autocomplete="off">
      <div id="rosterlist">${list}</div>
      <p class="note">Roster and photos from ESPN. A player with no headshot keeps the initial. Injury badges use this hub's ESPN injury report (college reports are often empty).</p>`;
  } else { $('#rosterlist').innerHTML=list; const c=$('#rostercount'); if(c) c.innerHTML=count; }
}
function closeRoster(){
